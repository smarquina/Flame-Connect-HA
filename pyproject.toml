[project]
name = "flame-connect-ha"
version = "0.3.0b0"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--disable-socket --allow-unix-socket --cov=custom_components.flame_connect --cov-branch --cov-report=term-missing"

[tool.coverage.run]
source = ["custom_components.flame_connect"]
branch = true
relative_files = true

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C901"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
follow_imports = "silent"
files = ["custom_components/flame_connect/domain", "custom_components/flame_connect/application", "custom_components/flame_connect/adapters/cloud/codec.py", "custom_components/flame_connect/adapters/cloud/tokens.py"]
