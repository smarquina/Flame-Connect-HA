# SonarQube Cloud organization/project identifiers are configured in build.yml.
sonar.projectName=Flame Connect HA
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=**/__pycache__/**,**/brand/**
# The current scope analyzer ignores sonar.tests. Test suites are not production coverage.
# Keep them in static analysis, but exclude their own lines from the coverage denominator.
sonar.coverage.exclusions=tests/**
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
