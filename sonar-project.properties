# Organization/project identifiers are provided by the connected SonarQube Cloud project.
sonar.projectName=Flame Connect HA
sonar.sources=custom_components/flame_connect,tools/link
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=**/__pycache__/**,**/brand/**
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
