name: SonarQube
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build and analyze
    # Fork PRs cannot access the analysis secret. No untrusted pull_request_target execution.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Check SonarQube Cloud connection
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_TOKEN" || { echo 'Add the SONAR_TOKEN repository secret.'; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      # mock-open and PyRIC publish source-only releases; their archives are hash-locked.
      - run: >-
          python -m pip install --only-binary=:all: --no-binary=mock-open,PyRIC --require-hashes -r requirements-test.lock
      - run: pytest --cov-report=xml:coverage.xml --cov-report=json --junitxml=test-results.xml
      - run: python tools/check_coverage.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=smarquina
            -Dsonar.projectKey=smarquina_Flame-Connect-HA
            -Dsonar.host.url=https://sonarcloud.io
